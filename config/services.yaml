# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:
    app.kyc_upload_directory: '%kernel.project_dir%/public/uploads/kyc'
    tempStorageDir: '%kernel.project_dir%/var/uploads/kyc_temp'

    # Configuration du router pour le mode console (CLI) ou les URLs absolues
    router.request_context.host: 'kysure.fr'
    router.request_context.scheme: 'https'
    router.request_context.base_url: ''
    gemini_api_key: '%env(GEMINI_API_KEY)%'

services:
    # ==========================================
    # 1. CONFIGURATION PAR DÉFAUT
    # ==========================================
    _defaults:
        autowire: true      # Injecte automatiquement les dépendances
        autoconfigure: true # Enregistre automatiquement les commandes, event subscribers, etc.
        bind:
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'
            $encryptionKey: '%env(default::ENCRYPTION_KEY)%'

    # ==========================================
    # 2. CHARGEMENT & EXCLUSIONS DDD (CLEAN ARCHITECTURE)
    # ==========================================
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'

            # --- Objets du Domaine (Ne doivent pas être dans le conteneur de services) ---
            - '../src/Entity/'
            - '../src/Domain/*/Entity/'
            - '../src/Domain/*/Event/'
            - '../src/Domain/*/ValueObject/'
            - '../src/Domain/*/Exception/'

            # --- Objets Applicatifs (Passés par paramètre, non instanciés par Symfony) ---
            - '../src/Application/DTO/'
            - '../src/Application/Request/'

    # ==========================================
    # 3. RÉSOLUTION DES INTERFACES (PORTS & ADAPTERS)
    # ==========================================

    # Résolution du système de stockage des documents (S3 par défaut)
    App\Domain\Port\DocumentStorageInterface: '@App\Infrastructure\Storage\ScalewayS3DocumentStorage'

    # Vérification ORIAS : le scraper réel enveloppé d'un cache (résultats définitifs uniquement)
    App\Domain\Workspace\Gateway\OriasCheckerInterface: '@App\Infrastructure\ExternalApi\CachedOriasChecker'
    App\Infrastructure\ExternalApi\CachedOriasChecker:
        arguments:
            $inner: '@App\Infrastructure\ExternalApi\OriasChecker'

    # MRR : provider Stripe enveloppé d'un cache court (l'appel API itère tous les abonnements actifs)
    App\Application\Billing\Provider\MrrProviderInterface: '@App\Infrastructure\Service\Payment\Stripe\CachedMrrProvider'
    App\Infrastructure\Service\Payment\Stripe\CachedMrrProvider:
        arguments:
            $inner: '@App\Infrastructure\Service\Payment\Stripe\StripeMrrProvider'

    # Résolution de l'OCR via sa Factory
    App\Domain\Port\OcrProviderInterface:
        factory: [ '@App\Infrastructure\Ocr\OcrFactory', 'create' ]
        arguments:
            $mode: '%env(OCR_MODE)%'

    # Résolution du client LCB-FT via sa Factory
    App\Domain\Port\OpenSanctionsClientInterface:
        factory: [ '@App\Infrastructure\Screening\Service\OpenSanctionsFactory', 'create' ]
        arguments:
            $mode: '%env(OPEN_SANCTIONS_MODE)%'

    # ==========================================
    # 4. CONFIGURATIONS EXPLICITES DES SERVICES
    # ==========================================

    # Client S3 (Scaleway)
    Aws\S3\S3Client:
        arguments:
            -   version: 'latest'
                region: '%env(S3_REGION)%'
                endpoint: '%env(S3_ENDPOINT)%'
                credentials:
                    key: '%env(S3_ACCESS_KEY)%'
                    secret: '%env(S3_SECRET_KEY)%'
                use_path_style_endpoint: true

    # Client SDK Mindee
    Mindee\ClientV2:
        arguments:
            $apiKey: '%env(MINDEE_API_KEY)%'

    # Client OpenSanctions natif
    App\Infrastructure\Screening\Service\OpenSanctionsClient:
        arguments:
            $openSanctionsApiKey: '%env(OPEN_SANCTIONS_API_KEY)%'

    # Générateur de PDF
    App\Infrastructure\Pdf\GotenbergPdfGenerator:
        arguments:
            $gotenbergUrl: '%env(GOTENBERG_URL)%'

    # ==========================================
    # 5. INJECTION DES PARAMÈTRES SPÉCIFIQUES
    # ==========================================

    App\Application\Compliance\UseCase\ComplianceDocument\UploadDocumentUseCase:
        arguments:
            $tempStorageDir: '%tempStorageDir%'

    App\Infrastructure\Storage\LocalDocumentStorage:
        arguments:
            $baseUploadDirectory: '%app.kyc_upload_directory%'

    App\Infrastructure\Billing\Controller\StripeWebhookController:
        arguments:
            $stripeWebhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'
    App\Infrastructure\Compliance\Controller\AcknowledgeDerController:
        arguments:
            $rateLimiter: '@limiter.der_acknowledgement'
            $readRateLimiter: '@limiter.der_acknowledgement_read'
    App\Infrastructure\Compliance\Controller\DeclineDerController:
        arguments:
            $rateLimiter: '@limiter.der_acknowledgement'
            $readRateLimiter: '@limiter.der_acknowledgement_read'
    App\Infrastructure\Compliance\Controller\DerPdfController:
        arguments:
            $readRateLimiter: '@limiter.der_acknowledgement_read'
    App\Infrastructure\Compliance\Controller\DerCertificateController:
        arguments:
            $readRateLimiter: '@limiter.der_acknowledgement_read'
    App\Infrastructure\Compliance\Controller\Client\ClientCreateController:
        arguments:
            $clientCreationLimiter: '@limiter.client_creation'
    App\Infrastructure\User\Twig\Components\CreateUserFormComponent:
        arguments:
            $registrationLimiter: '@limiter.user_registration'
    App\Infrastructure\Workspace\Twig\Components\Invitation\CreateInvitationFormComponent:
        arguments:
            $workspaceInvitationLimiter: '@limiter.workspace_invitation'
    App\Infrastructure\Workspace\Twig\Components\Invitation\ResendWorkspaceInvitationComponent:
        arguments:
            $workspaceInvitationResendLimiter: '@limiter.workspace_invitation_resend'
    App\Infrastructure\Workspace\Controller\WorkspaceInvitationConfirmTokenController:
        arguments:
            $workspaceInvitationConfirmLimiter: '@limiter.workspace_invitation_confirm'
    App\Domain\Workspace\Service\CurrentWorkspaceProvider:
        tags:
            - { name: 'kernel.reset', method: 'reset' }
    # Sessions en PostgreSQL (aucune infra ajoutée) : elles survivent aux déploiements (plus de
    # déconnexion de tous les CGP / clients du portail) et sont partagées si plusieurs conteneurs web.
    # Connexion PDO dédiée + verrou consultatif (même sérialisation des requêtes concurrentes
    # d'un utilisateur qu'avec les fichiers, sans transaction ouverte).
    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '%env(DATABASE_URL)%'
            - { lock_mode: !php/const Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler::LOCK_ADVISORY }
    App\Infrastructure\Security\MessageCipher:
        arguments:
            $encryptionKey: '%env(base64:default::ENCRYPTION_KEY)%'
    App\Domain\Shared\Port\RealTimeNotifierInterface:
        alias: App\Infrastructure\Shared\Notifier\MercureRealTimeNotifier
    App\Domain\Database\TransactionManagerInterface: '@App\Infrastructure\Database\DoctrineTransactionManager'
    Aws\Textract\TextractClient:
        arguments:
            $args:
                version: 'latest' # Ou 'latest'
                region: '%env(AWS_REGION)%'
                credentials:
                    key: '%env(AWS_KEY)%'
                    secret: '%env(AWS_SECRET)%'
    App\Domain\Compliance\Service\GeminiMeetingAnalyzer:
        arguments:
            $geminiApiKey: '%gemini_api_key%'

