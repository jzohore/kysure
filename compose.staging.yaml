# -----------------------------------------------------------------------------
# Rotation des logs Docker : sans ça, /var/lib/docker/containers/*/*-json.log
# grossit sans limite (Symfony prod logue en JSON sur php://stderr + accès
# FrankenPHP) → disque plein en ~1 j sur un petit serveur → Postgres ne peut
# plus écrire → tout s'arrête sans trace applicative.
# -----------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# -----------------------------------------------------------------------------
# Limites mémoire : hypothèse serveur = 4 Go (cf. commentaires Caddyfile /
# conf.d). Objectif : borner chaque service pour qu'une fuite lente ne fasse
# plus tuer un conteneur au hasard par l'OOM killer du noyau (sans trace).
# Un dépassement de limite → OOMKilled visible dans `docker inspect` +
# redémarrage propre par Docker. Ajuste si le serveur n'a pas 4 Go.
# -----------------------------------------------------------------------------

services:
  php-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: frankenphp_prod
    container_name: kysure_web_staging
    restart: unless-stopped
    environment:
      SERVER_NAME: '${SERVER_NAME:-:80}'
      TRUSTED_PROXIES: '${TRUSTED_PROXIES}'
      APP_ENV: staging
      KYSURE_ROLE: web
      # Borne le pool de threads FrankenPHP (sinon = nb de vCPU, chacun jusqu'à
      # memory_limit=512M → OOM sur un serveur chargé).
      FRANKENPHP_NUM_THREADS: '2'
      SOPS_AGE_KEY: '${SOPS_AGE_KEY}'
      DATABASE_URL: '${DATABASE_URL}'
      MESSENGER_TRANSPORT_DSN: '${MESSENGER_TRANSPORT_DSN}'
      MAILER_DSN: 'smtp://mailpit-staging:1025'
      GOTENBERG_URL: 'http://gotenberg-staging:3000/forms/chromium/convert/html'
      # Verrou anti-concurrence des tâches planifiées : local au conteneur worker,
      # suffisant tant qu'une seule instance de worker consomme les messages.
      LOCK_DSN: 'flock'
      # Analytique Umami : le <script> n'est rendu que si les deux sont non vides.
      UMAMI_SCRIPT_URL: 'https://analytics.staging.kysure.fr/script.js'
      UMAMI_WEBSITE_ID: '${UMAMI_WEBSITE_ID}'
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      database-staging:
        condition: service_healthy
      rabbitmq-staging:
        condition: service_healthy

  worker-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: frankenphp_prod
    container_name: kysure_worker_staging
    restart: unless-stopped
    environment:
      APP_ENV: staging
      KYSURE_ROLE: worker
      SOPS_AGE_KEY: '${SOPS_AGE_KEY}'
      DATABASE_URL: '${DATABASE_URL}'
      MESSENGER_TRANSPORT_DSN: '${MESSENGER_TRANSPORT_DSN}'
      MAILER_DSN: 'smtp://mailpit-staging:1025'
      GOTENBERG_URL: 'http://gotenberg-staging:3000/forms/chromium/convert/html'
      # Le worker exécute les tâches planifiées (scheduler_cron) : c'est ici que
      # le verrou anti-concurrence protège contre une double exécution.
      LOCK_DSN: 'flock'
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      database-staging:
        condition: service_healthy
      rabbitmq-staging:
        condition: service_healthy

  database-staging:
    image: 'postgres:16-alpine'
    container_name: kysure_db_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    volumes:
      - 'postgres_staging_data:/var/lib/postgresql/data'
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq-staging:
    image: 'rabbitmq:4.3-management-alpine'
    container_name: kysure_rabbitmq_staging
    hostname: kysure_rabbitmq_staging
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:-kysure}'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD manquant}'
    volumes:
      - 'rabbitmq_staging_data:/var/lib/rabbitmq'
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mailpit-staging:
    image: 'axllent/mailpit:latest'
    container_name: kysure_mailpit_staging
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE_PATH: /data/mailpit.db
      MP_SMTP_BIND_ADDR: '0.0.0.0:1025'
      MP_UI_BIND_ADDR: '0.0.0.0:8025'
    volumes:
      - 'mailpit_staging_data:/data'
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.mailpit-staging.loadbalancer.server.port=8025"

  gotenberg-staging:
    image: 'gotenberg/gotenberg:8'
    container_name: kysure_gotenberg_staging
    restart: unless-stopped
    # Chromium fuit / laisse des zombies si une conversion plante : la limite
    # mémoire borne le rayon de blast (OOMKilled visible + redémarrage propre).
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
        # Décommente si ta version de Coolify/compose le supporte :
        # pids: 256
  # Analytique self-hosted (visites, sources, campagnes UTM). Sans cookie ni PII.
  # Domaine à fixer dans l'UI Coolify sur ce service : analytics.staging.kysure.fr
  # Vars requises dans l'éditeur d'env Coolify : UMAMI_DB_PASSWORD, UMAMI_APP_SECRET,
  # UMAMI_WEBSITE_ID (vide au 1er déploiement, renseigné après création du site).
  umami-staging:
    image: 'ghcr.io/umami-software/umami:postgresql-latest'   # prod : pin, ex. :v2.19.0-postgresql
    container_name: kysure_umami_staging
    restart: unless-stopped
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: 'postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db-staging:5432/umami'
      APP_SECRET: '${UMAMI_APP_SECRET}'
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      # service_started (pas service_healthy) : un souci sur l'analytique ne doit
      # pas faire échouer tout le déploiement. Umami retente la connexion DB seul.
      umami-db-staging:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/heartbeat" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.umami-staging.loadbalancer.server.port=3000"

  umami-db-staging:
    image: 'postgres:16-alpine'
    container_name: kysure_umami_db_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: '${UMAMI_DB_PASSWORD}'
    volumes:
      - 'umami_db_staging_data:/var/lib/postgresql/data'
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U umami -d umami" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_staging_data: null
  rabbitmq_staging_data: null
  mailpit_staging_data: null
  umami_db_staging_data: null
