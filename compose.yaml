---
# Rotation des logs Docker (json-file par défaut = croissance illimitée).
# Fichier de DÉVELOPPEMENT (avec compose.override.yaml). Staging et production ont chacun leur fichier
# autonome : compose.staging.yaml et compose.prod.yaml (déployés par Coolify).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  php:
    image: ${IMAGES_PREFIX:-}app-php
    restart: unless-stopped
    logging: *default-logging
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # Run "composer require symfony/orm-pack" to install and configure Doctrine ORM
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-15}&charset=${POSTGRES_CHARSET:-utf8}
      # Run "composer require symfony/mercure-bundle" to install and configure the Mercure integration
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # The two next lines can be removed after initial installation
      SYMFONY_VERSION: ${SYMFONY_VERSION:-}
      STABILITY: ${STABILITY:-stable}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
      - .env.local
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"   # Port AMQP
      - "15672:15672" # Interface Management (UI)

  mailpit:
    image: axllent/mailpit
    logging: *default-logging
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

# Mercure is installed as a Caddy module, prevent the Flex recipe from installing another service
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - "5432:5432" # <-- LA LIGNE MAGIQUE : Expose le port de Docker vers ton ordi
    env_file:
      - .env
      - .env.local
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

###> sensiolabs/gotenberg-bundle ###
  gotenberg:
    image: 'gotenberg/gotenberg:8'
    logging: *default-logging
###< sensiolabs/gotenberg-bundle ###

  # Antivirus (ClamAV / clamd) : analyse chaque pièce déposée par un client avant stockage.
  # Écoute en interne sur clamav:3310 (jamais publié). Au premier démarrage, la base de
  # signatures se télécharge (1 à 3 min) : tant que le démon n'est pas prêt, les dépôts sont
  # refusés (fail-closed). Prévoir ~1 à 2 Go de RAM. En dev, VIRUS_SCAN_MODE=disabled dans
  # .env.local évite de le lancer.
  clamav:
    image: clamav/clamav:1.4
    # L'image officielle n'est publiée qu'en amd64 : émulée sur Mac Apple Silicon (dev), native en prod.
    platform: linux/amd64
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLAMD_CONF_StreamMaxLength: 25M
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: [ "CMD", "/usr/local/bin/clamdcheck.sh" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Service d'extraction OCR LOCAL (FastAPI + Tesseract + MRZ à clés ICAO) : lit domicile / RIB / K-bis /
  # MRZ sans envoyer la pièce à un tiers. Voir ocr-service/README.md et docs/specs/ocr-des-pieces-deposees.md § 2 bis.
  # Joignable en interne sur ocr:8000 (jamais publié), jeton Bearer obligatoire. Utilisé quand OCR_MODE=local|hybrid
  # (à poser dans .env.local) :   docker compose up -d --build ocr
  # Limite mémoire ≈ 512 Mo (mesuré : ~230 Mo de pic sur un scan A4 dense de 2 pages), FS en lecture seule.
  ocr:
    build:
      context: ./ocr-service
      target: runtime
    restart: unless-stopped
    logging: *default-logging
    environment:
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:-dev-only-ocr-token-change-me}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  # Analytique self-hosted (visites, sources, campagnes UTM, conversions).
  # Sans cookie, sans PII → pas de bannière de consentement.
  # Base Postgres dédiée et isolée (ne touche pas la base applicative). Umami
  # joue ses migrations au démarrage. UI sur http://localhost:3001
  # (login initial admin / umami — à changer immédiatement).
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-!ChangeThisUmamiAppSecret!}
    ports:
      - "3001:3000"

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U umami -d umami" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  db_data:
  umami_db_data:
  clamav_data:
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
