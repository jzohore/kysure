security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # 1. DEUX POPULATIONS DISTINCTES
    providers:
        app_user_provider:
            entity:
                class: App\Domain\User\Entity\User
                property: email
        app_client_provider:
            entity:
                class: App\Domain\User\Entity\Client
                property: email
        app_admin_provider:
            entity:
                class: App\Domain\User\Entity\Admin
                property: email


    # LA PYRAMIDE DES RÔLES (Préservée)
    role_hierarchy:
        # --- L'arbre métier ---
        ROLE_CLIENT: [ ROLE_USER ]
        ROLE_WORKSPACE_COLLAB: [ ROLE_USER ]
        ROLE_WORKSPACE_ADMIN: [ ROLE_WORKSPACE_COLLAB ]

        # --- L'arbre système ---
        # La connexion support (impersonation d'un collaborateur) ne passe PAS par
        # le switch_user de Symfony : l'opérateur vit sur le firewall « admin »
        # (entité Admin) et la cible sur le firewall « main » (entité User), deux
        # provideurs distincts. Elle est déclenchée depuis /admin, exige un motif
        # et est tracée dans le journal d'audit du cabinet (cf. ImpersonateWorkspaceController).
        ROLE_ADMIN: [ ROLE_USER ]
        ROLE_SUPER_ADMIN: [ ROLE_ADMIN, ROLE_SUPPORT ]
        ROLE_SUPPORT: [ ROLE_USER ]

    firewalls:
        image_resolver:
            pattern: ^/media/cache/resolve
            security: false
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # 🟦 FIREWALL 1 : LE PORTAIL CLIENT FINAL (Magic Link Dédié)
        admin:
            pattern: ^/admin
            provider: app_admin_provider
            lazy: true
            user_checker: App\Infrastructure\Security\AdminStatusChecker
            custom_authenticator:
                - App\Infrastructure\Security\MagicAdminLinkAuthenticator
            form_login:
                login_path: app_login
                check_path: app_admin_verify
                enable_csrf: true
                default_target_path: admin_dashboard
                always_use_default_target_path: true
            logout:
                path: app_admin_logout
                target: app_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        # 🟦 FIREWALL 1 : LE PORTAIL CLIENT FINAL (Magic Link Dédié)
        portal:
            pattern: ^/portal
            provider: app_client_provider
            lazy: true
            user_checker: App\Infrastructure\Security\ClientStatusChecker
            custom_authenticator:
                - App\Infrastructure\Security\MagicClientLinkAuthenticator
            form_login:
                login_path: app_login
                check_path: app_portal_verify
                enable_csrf: true
                default_target_path: app_portal_dashboard
                always_use_default_target_path: true
            logout:
                path: app_portal_logout
                target: app_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                trusted_parameter_name: _trusted

        # 🟪 FIREWALL 2 : L'APPLICATION DES CGP & ADMINS (Ton firewall principal existant)
        main:
            pattern: ^/
            lazy: true
            provider: app_user_provider

            custom_authenticator:
                - App\Infrastructure\Security\MagicLinkAuthenticator

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard

            logout:
                path: app_logout
                target: app_login

            login_throttling:
                max_attempts: 3
                interval: '15 minutes'

            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                trusted_parameter_name: _trusted

            user_checker: App\Infrastructure\Security\WorkspaceStatusChecker

    # 2. VERROUILLAGE CHIRURGICAL DES ROUTES
    access_control:
        # Routes publiques absolues
        - { path: ^/portal/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/stripe/webhook, roles: PUBLIC_ACCESS }
        # Accusé de réception du DER : lien nominatif à jeton (256 bits, haché en base), pas de compte client à ce stade.
        - { path: ^/der/, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        # Invitation collaborateur : lien nominatif à jeton (512 bits, haché en base).
        # Le destinataire n'a pas encore de compte ; l'acceptation le connecte sur
        # le firewall « main ». Ces routes vivent donc hors de ^/portal (firewall client).
        - { path: ^/invitation, roles: PUBLIC_ACCESS }

        # Double authentification en cours
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }

        # Protection étanche du Portail Client
        - { path: ^/portal, roles: ROLE_CLIENT }

        # Protection de l'espace utilisateur et de l'application CGP
        - { path: ^/app/, roles: ROLE_USER }

        # API internes du front CGP (enregistreur d'entretien, logo) : filet global.
        # Le webhook Stripe (public, signé) est déclaré plus haut, donc non concerné.
        # Le contrôle fin (cabinet + confidentialité) reste dans les voters.
        - { path: ^/api/, roles: ROLE_USER }

        # Protection de l'espace administrateur (back-office KYSURE)
        # La gestion de l'équipe et les zones sensibles restent réservées au SUPER_ADMIN ;
        # les opérateurs (ROLE_ADMIN) accèdent au reste du back-office.
        - { path: ^/admin/administrators, roles: ROLE_SUPER_ADMIN }
        - { path: ^/admin/audit-logs, roles: ROLE_SUPER_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
