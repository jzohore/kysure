name: 🚀 KYSURE CI/CD Pipeline

on:
    push:
        branches-ignore:
            - staging   # 🛡️ Évite la boucle infinie : le job merge-to-staging pousse
            # sur staging, ce qui redéclencherait le workflow sans cette exclusion.
            - master    # 🛡️ Idem côté promotion staging → master (workflow séparé
            # promote-to-master.yml) : évite qu'un fast-forward sur master ne
            # redéclenche inutilement toute la pipeline dessus.
    workflow_call:
        # 🛡️ Permet à promote-to-master.yml de rejouer quality-assurance et
        # docker-security sur le SHA réel de `staging` (celui qui sera promu),
        # au lieu de se fier au scan déjà fait sur la feature branch d'origine.
        inputs:
            ref:
                description: "Ref à checkout pour les jobs de scan (branche, tag ou SHA). Par défaut : le SHA courant."
                required: false
                type: string

# 🛡️ Permissions par défaut resserrées au strict minimum (lecture seule).
# Seul le job qui en a réellement besoin (merge-to-staging) élève ses droits
# localement, ci-dessous — évite qu'un job d'analyse statique dispose d'un
# droit d'écriture sur le repo dont il n'a aucun usage.
permissions:
    contents: read

jobs:
    # 🛡️ ÉTAPE 1a : SECRETS & CONTRÔLE QUALITÉ CODE
    quality-assurance:
        name: Code Quality & Static Analysis (PHP 8.4)
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            -   name: Checkout Code
                uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.ref || github.sha }}
                    fetch-depth: 0   # nécessaire pour les tâches GrumPHP basées sur git diff, et pour gitleaks

            # 🛡️ Scan de secrets : clés API, tokens, mots de passe committés par
            # erreur. Placé en tout premier car quasi instantané et le plus
            # critique à attraper avant tout le reste.
            # NOTE : gitleaks-action@v2 tourne encore sur Node 20 (déprécié par
            # GitHub). Non bloquant. Fix définitif = lancer le binaire officiel
            # dans un step `run:` (voir plus bas, commenté) dès que l'upstream
            # ne publie pas de version Node 24.
            -   name: Scan for leaked secrets (gitleaks)
                uses: gitleaks/gitleaks-action@v2
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            # -   name: Scan for leaked secrets (gitleaks, binaire épinglé)
            #     run: |
            #         docker run --rm -v "${{ github.workspace }}:/repo" \
            #           ghcr.io/gitleaks/gitleaks:v8.24.3 \
            #           git /repo --redact -v --exit-code 1

            -   name: Setup PHP 8.4
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, apcu, opcache, zip, amqp, sockets, gd, imagick, sodium
                    coverage: none

            -   name: Validate composer.json / composer.lock
                run: composer validate --strict

            -   name: Get Composer Cache Directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache Dependencies
                uses: actions/cache@v4.2.4   # v4.2.x = runtime Node 24 (fin de la dépréciation Node 20)
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-composer-php84-${{ hashFiles('**/composer.lock') }}
                    restore-keys: ${{ runner.os }}-composer-php84-

            -   name: Install Dependencies
                run: composer install --prefer-dist --no-progress --no-interaction

            -   name: Run KYSURE Quality Pipeline (GrumPHP)
                run: vendor/bin/grumphp run --no-interaction

    # 🛡️ ÉTAPE 1b : SÉCURITÉ DOCKER (lint + build + scan de vulnérabilités)
    # Tourne en parallèle de quality-assurance. Aurait attrapé, avant tout
    # merge, chacun des bugs de build qu'on a dû déboguer en live sur staging
    # (opcache.preload, extension sodium manquante, Caddyfile cassé...).
    docker-security:
        name: 🐳 Docker Build & Security Scan
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            -   name: Checkout Code
                uses: actions/checkout@v7   # aligné sur les autres jobs (Node 24)
                with:
                    ref: ${{ inputs.ref || github.sha }}

            -   name: Lint Dockerfile (hadolint)
                uses: hadolint/hadolint-action@v3.1.0
                with:
                    dockerfile: Dockerfile
                    # Niveau d'échec : n'arrête le job que sur les erreurs, pas
                    # les infos/styles. À resserrer à "warning" quand le
                    # Dockerfile sera stabilisé.
                    failure-threshold: error

            # 🛡️ Smoke test : vérifie que l'image se construit réellement.
            # Les ARG ont des valeurs par défaut factices dans le Dockerfile
            # (APP_SECRET, DATABASE_URL, SENTRY_DSN) — aucun secret réel requis
            # pour ce build de vérification.
            -   name: Build Docker image (smoke test)
                run: |
                    docker build --pull --target frankenphp_prod -t kysure-ci-scan:${{ github.sha }} .

            -   name: Scan image for vulnerabilities (Trivy)
                uses: aquasecurity/trivy-action@v0.36.0
                with:
                    image-ref: kysure-ci-scan:${{ github.sha }}
                    format: table
                    # 🛡️ Se limite au CRITICAL pour démarrer sans bloquer sur
                    # l'existant : resserrer à "CRITICAL,HIGH" une fois le
                    # backlog de vulnérabilités connu traité.
                    severity: CRITICAL
                    exit-code: 1
                    ignore-unfixed: true   # pas de blocage sur des CVE sans correctif disponible
                    # 🛡️ Exceptions justifiées + datées : binaires Go tiers
                    # (frankenphp, sops) dont l'upstream n'a pas encore de build
                    # corrigé. Voir .trivyignore (revue le 2026-10-15).
                    trivyignores: .trivyignore

    # 🔀 ÉTAPE 2 : FUSION AUTOMATIQUE VERS STAGING
    merge-to-staging:
        name: 🔀 Auto-Merge to Staging
        needs: [quality-assurance, docker-security]
        runs-on: ubuntu-latest
        # 🛡️ Ne tourne que sur un vrai push de feature branch, jamais quand ce
        # workflow est réutilisé par promote-to-master.yml (re-scan de staging).
        if: github.event_name == 'push'
        permissions:
            contents: write   # 🛡️ Élevé uniquement ici, pour git push origin staging
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Merge branch to staging
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  git fetch origin staging || true
                  git checkout staging || git checkout -b staging

                  # Fusionne la branche de ticket courante vers staging
                  git merge "${{ github.sha }}" --no-edit

                  git push origin staging

